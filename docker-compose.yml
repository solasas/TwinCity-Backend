# --- Airflow (Phase 2.5): orchestrates slower, batch-y ingestion (weather, eventually road status). ---
# Airflow gets its OWN metadata Postgres (airflow-db) rather than sharing the app's `db` (PostGIS)
# instance — keeps Airflow's internal schema/migrations completely decoupled from the app's schema,
# so upgrading or resetting one never risks the other. DAGs still connect OUT to `db` (via
# DIGITALTWIN_DB_DSN) to write into app tables like `weather` — that's the actual integration point.
x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.0
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    # No secrets stored via Airflow Connections (DAGs read DIGITALTWIN_DB_DSN directly, below),
    # so there's nothing that needs Fernet encryption at rest — fine to leave unset for local dev.
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-digitaltwin-airflow-jwt-secret-dev-only}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # DSN the DAGs use to write into the app's own PostGIS database (the `db` service below).
    DIGITALTWIN_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - digitaltwin-airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: digitaltwin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host 5433 avoids clashing with a locally-installed PostgreSQL on 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - digitaltwin-db-data:/var/lib/postgresql/data
      - ./data/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitaltwin -d digitaltwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitaltwin-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - digitaltwin-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16-alpine
    container_name: digitaltwin-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - digitaltwin-airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: digitaltwin-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow db migrate
        /entrypoint airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: digitaltwin-airflow-apiserver
    command: api-server
    restart: unless-stopped
    ports:
      # Host 8081 avoids clashing with the app itself (SERVER_PORT, default 8080).
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: digitaltwin-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: digitaltwin-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  digitaltwin-db-data:
  digitaltwin-redis-data:
  digitaltwin-airflow-db-data:
  digitaltwin-airflow-logs: