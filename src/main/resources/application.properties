spring.application.name=DigitalTwinBackend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/digitaltwin
spring.datasource.username=digitaltwin
spring.datasource.password=digitaltwin
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is created by docker-compose (data/sql/schema.sql) and populated by the
# import script, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.graphql.graphiql.enabled=true

# CORS for the React dev server (Vite default port).
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=GET,POST
spring.graphql.cors.allowed-headers=*
