spring.application.name=DigitalTwinBackend

spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:digitaltwin}
spring.datasource.username=${POSTGRES_USER:digitaltwin}
spring.datasource.password=${POSTGRES_PASSWORD:digitaltwin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Schema is created by docker-compose (data/sql/schema.sql) and populated by the
# import script, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.graphql.graphiql.enabled=true
spring.graphql.websocket.path=/graphql

# CORS for the React dev server (Vite default port).
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=GET,POST
spring.graphql.cors.allowed-headers=*

# Vehicle feed (Phase 2.1, revised for Rajahmundry): Rajahmundry has no public GTFS-realtime
# feed, so a simulated feed (SimulatedVehiclePoller) is active by default. Set
# VEHICLE_FEED_SIMULATED=false and configure GTFS_VEHICLE_POSITIONS_URL to use a real
# GTFS-realtime feed instead (e.g. for a city that actually has one).
vehicle-feed.simulated=${VEHICLE_FEED_SIMULATED:true}
simulated-vehicles.count=${SIMULATED_VEHICLES_COUNT:10}

# Real GTFS-realtime poller — inactive unless vehicle-feed.simulated=false. MBTA's feed is kept
# as the placeholder URL (fully public, no API key) from when this pointed at Hoboken/Boston.
gtfs.realtime.vehicle-positions-url=${GTFS_VEHICLE_POSITIONS_URL:https://cdn.mbta.com/realtime/VehiclePositions.pb}
gtfs.realtime.poll-interval-ms=${GTFS_POLL_INTERVAL_MS:20000}

